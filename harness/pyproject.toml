[project]
name = "harness"
version = "0.1.0"
description = "AI harness for project initialisation — v0 walking skeleton"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2",
  "typer>=0.12",
  "pyyaml>=6.0",
  "anthropic>=0.40",
]

[project.scripts]
harness = "harness.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[dependency-groups]
dev = [
  "ruff>=0.8",
  "pyright>=1.1",
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# typer's documented pattern is `param: T = typer.Option(...)` in the signature.
"src/harness/cli.py" = ["B008"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/harness"]
